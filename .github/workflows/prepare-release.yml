name: "Release: Prepare"

# Run by hand: Actions tab -> Release: Prepare -> Run workflow, on `develop`,
# choosing the kind of release. See "Versioning and releases" in
# .github/CONTRIBUTING.md.
#
# 1. Checks the changes since the last release and refuses a bump that is too
#    small (python -m tools.release prepare).
# 2. Commits the new version.txt and CHANGELOG.md entry to develop.
# 3. Opens the release PR from develop into main. Merging it publishes the
#    release.
#
# The version is bumped on develop, not on main, so main never has to be
# merged back into develop (which would bring main-only files like the .xlsx
# and .mat exports with it).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Kind of release (see .github/CONTRIBUTING.md)"
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write
  pull-requests: write

# Never prepare two releases at once.
concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    steps:
      - name: Only run on develop
        if: github.ref != 'refs/heads/develop'
        run: |
          echo "::error::Run Release: Prepare on develop, not on ${GITHUB_REF_NAME}."
          exit 1

      # RELEASE_TOKEN (a fine-grained personal access token with Contents and
      # Pull requests write access to this repo) is used when it exists. Pushes
      # and PRs made with the default GITHUB_TOKEN do not trigger other
      # workflows, so without it the release PR's checks will not start on
      # their own.
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0 # full history and tags: the check reads the last release
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check the changes and bump the version
        id: prepare
        env:
          PYTHONPATH: code
          BUMP: ${{ inputs.bump }}
        run: |
          VERSION=$(python -m tools.release next-version --bump "$BUMP")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python -m tools.release prepare --bump "$BUMP" --pr-body "$RUNNER_TEMP/pr_body.md"
          cat "$RUNNER_TEMP/pr_body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit to develop
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.txt CHANGELOG.md
          git commit -m "release: $VERSION"
          git push origin develop

      - name: Open the release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          gh pr create --base main --head develop \
            --title "release: $VERSION" \
            --body-file "$RUNNER_TEMP/pr_body.md"
